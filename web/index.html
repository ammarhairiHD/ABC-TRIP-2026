<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ABC Trip 2026</title>
    <meta name="description" content="Kathmandu to Annapurna Base Camp, 9-19 October 2026." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // The full boot screen below only plays once per browser session (a
      // hard refresh later in the same tab gets a quick, undelayed fade
      // instead of the full ~2s game-boot beat) -- see main.tsx's
      // il-fade-out logic for the other half of this. Runs synchronously,
      // before #initial-loader below is parsed, so a repeat visit never
      // paints the full screen for even one frame.
      (function () {
        try {
          if (sessionStorage.getItem("abcBootShown")) {
            document.documentElement.classList.add("il-skip-boot");
          } else {
            sessionStorage.setItem("abcBootShown", "1");
            window.__abcBootStart = Date.now();
          }
        } catch (e) {
          // Storage can throw in locked-down contexts (private mode, etc);
          // falling through just means every load gets the full boot beat.
        }
      })();
    </script>
    <style>
      /*
        Pre-React loading screen. Colors are copied literally from the
        8-bit palette in src/index.css (not the --color-* vars) so this
        paints correctly even before the built stylesheet or any JS runs --
        the whole point of this block is to cover that gap.
      */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 0 32px;
        background: #1b1f2b;
        transition: opacity 0.2s ease-out;
      }
      #initial-loader.il-fade-out {
        opacity: 0;
        pointer-events: none;
      }
      /* Repeat visit this session: skip the full boot screen entirely,
         no transition, so there's no flash of it before JS removes it. */
      .il-skip-boot #initial-loader {
        display: none;
      }
      #initial-loader .il-sprite {
        width: 128px;
        height: 128px;
        overflow: hidden;
      }
      #initial-loader .il-sprite img {
        display: block;
        width: 512px;
        max-width: none;
        height: 128px;
        image-rendering: pixelated;
        animation: il-walk 0.6s steps(4) infinite;
      }
      #initial-loader .il-label {
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 11px;
        color: #e9e4d6;
      }
      #initial-loader .il-dots::after {
        content: "...";
        display: inline-block;
        width: 1.2em;
        overflow: hidden;
        white-space: nowrap;
        vertical-align: bottom;
        animation: il-dots 1.2s steps(4) infinite;
      }
      #initial-loader .il-tip {
        position: relative;
        width: 280px;
        height: 3.6em;
      }
      #initial-loader .il-tip span {
        position: absolute;
        inset: 0;
        display: block;
        text-align: center;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        font-size: 11px;
        line-height: 1.5;
        color: #a6a2ad;
        opacity: 0;
      }
      #initial-loader .il-tip span:nth-child(1) {
        animation: il-tip-1 16s steps(1, end) infinite;
      }
      #initial-loader .il-tip span:nth-child(2) {
        animation: il-tip-2 16s steps(1, end) infinite;
      }
      #initial-loader .il-tip span:nth-child(3) {
        animation: il-tip-3 16s steps(1, end) infinite;
      }
      #initial-loader .il-tip span:nth-child(4) {
        animation: il-tip-4 16s steps(1, end) infinite;
      }
      @keyframes il-walk {
        from { transform: translateX(0); }
        to { transform: translateX(-512px); }
      }
      @keyframes il-dots {
        from { width: 0; }
        to { width: 1.2em; }
      }
      @keyframes il-tip-1 {
        0%, 24.9% { opacity: 1; }
        25%, 100% { opacity: 0; }
      }
      @keyframes il-tip-2 {
        0%, 24.9% { opacity: 0; }
        25%, 49.9% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes il-tip-3 {
        0%, 49.9% { opacity: 0; }
        50%, 74.9% { opacity: 1; }
        75%, 100% { opacity: 0; }
      }
      @keyframes il-tip-4 {
        0%, 74.9% { opacity: 0; }
        75%, 100% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .il-sprite img,
        #initial-loader .il-dots::after {
          animation: none;
        }
        #initial-loader .il-dots::after {
          width: 1.2em;
        }
        #initial-loader .il-tip span {
          animation: none !important;
          opacity: 0;
        }
        #initial-loader .il-tip span:first-child {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader" role="status" aria-live="polite">
      <div class="il-sprite">
        <img src="/sprites/ammar-walk.png" alt="" aria-hidden="true" />
      </div>
      <p class="il-label">LOADING<span class="il-dots" aria-hidden="true"></span></p>
      <div class="il-tip">
        <span>TIP: Tap any photo to see everyone in it.</span>
        <span>TIP: Every person on this trip has their own journey page.</span>
        <span>TIP: Switch to gallery mode for a quick scroll through everything.</span>
        <span>TIP: Scenery by Alya is tucked in near the end of the climb.</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
